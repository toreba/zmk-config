# GitHub Actions matrix (fallback for machines without Nix, e.g. Windows).
# The same build as flake.nix: Studio and the Raw HID shield on the left
# (central) half only.
---
include:
  - board: glove80_lh
    shield: raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: glove80_rh
